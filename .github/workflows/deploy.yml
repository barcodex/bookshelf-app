name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_KHR3eKKwaDpydBeboFJq1Hl1
          VERCEL_PROJECT_ID: prj_MsyUwggylKwZn2KAYFM5wHBb8nXo
